<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">

  <body>
    <header class="header">

        <a href="#" class="header__link">Samsung</a>
        <a href="#" class="header__link">Accessories</a>
        <a href="#" class="header__link" data-qa="nav-hover">

        </a>

        <a href="#" class="header__link">Photo</a>
        <a href="#" class="header__link">Video</a>

            <img src="/star-active.2be54011.svg" alt="Estrela ativa" class="card__star card__star--active">
            <img src="/star-active.2be54011.svg" alt="Estrela ativa" class="card__star card__star--active">

            <img src="/star.fa806e3c.svg" alt="Estrela inativa" class="card__star">

          </div>
          <div class="card__price">
            Price: <span>$2,199</span>
          </div>
          <a href="#" class="card__buy" data-qa="card-hover">Buy</a>
        </div>

        <!-- Repita outros cards aqui -->
      </div>
